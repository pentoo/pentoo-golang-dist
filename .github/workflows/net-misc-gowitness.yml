name: net-misc/gowitness golang vendor dist

on:
  workflow_dispatch:
    inputs:
      version:
        description: "gowitness version tag (e.g. 2.5.0)"
        required: true

permissions:
  contents: write

jobs:
  golang-dist:
    uses: ./.github/workflows/go-modules.yml
    with:
      project: gowitness
      repository: sensepost/gowitness
      version: ${{ inputs.version }}
      ref_prefix: ""
