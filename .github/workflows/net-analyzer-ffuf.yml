name: net-analyzer/ffuf golang vendor dist

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ffuf version tag (e.g. 2.2.1)"
        required: true

permissions:
  contents: write

jobs:
  golang-dist:
    uses: ./.github/workflows/go-modules.yml
    with:
      project: ffuf
      repository: ffuf/ffuf
      version: ${{ inputs.version }}
