name: httpx golang vendor dist

on:
  workflow_dispatch:
    inputs:
      version:
        description: "httpx version tag (e.g. 1.8.1)"
        required: true

permissions:
  contents: write

jobs:
  golang-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream httpx
        uses: actions/checkout@v4
        with:
          repository: projectdiscovery/httpx
          ref: "v${{ github.event.inputs.version }}"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Download modules
        env:
          GOMODCACHE: /tmp/go-mod
        run: go mod download -x -modcacherw

      - name: Create deps tarball
        env:
          XZ_OPT: "-T0 -9e"
        run: |
          find /tmp/go-mod/cache/download -type f -name '*.zip' -delete
          LC_ALL=C TZ=UTC tar -C /tmp \
            --mtime="1970-01-01" --sort=name --owner=250 --group=250 \
            -acf "httpx-${{ github.event.inputs.version }}-deps.tar.xz" go-mod

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "httpx-${{ github.event.inputs.version }}"
          name: "httpx ${{ github.event.inputs.version }} vendor dist"
          files: "httpx-${{ github.event.inputs.version }}-deps.tar.xz"
          fail_on_unmatched_files: true
