name: app-forensics/maldoctrace golang vendor dist

on:
  workflow_dispatch:
    inputs:
      version:
        description: "maldoctrace version tag (e.g. 0.4.0)"
        required: true

permissions:
  contents: write

jobs:
  golang-dist:
    uses: ./.github/workflows/go-modules.yml
    with:
      project: maldoctrace
      repository: debugactiveprocess/MaldocTrace
      version: ${{ inputs.version }}
