name: net-analyzer/subfinder golang vendor dist

on:
  workflow_dispatch:
    inputs:
      version:
        description: "subfinder version tag (e.g. 2.9.0)"
        required: true

permissions:
  contents: write

jobs:
  golang-dist:
    uses: ./.github/workflows/go-modules.yml
    with:
      project: subfinder
      repository: projectdiscovery/subfinder
      version: ${{ inputs.version }}
