name: net-analyzer/httpx golang vendor dist

on:
  workflow_dispatch:
    inputs:
      version:
        description: "httpx version tag (e.g. 1.10.0)"
        required: true

permissions:
  contents: write

jobs:
  golang-dist:
    uses: ./.github/workflows/go-modules.yml
    with:
      project: httpx
      repository: projectdiscovery/httpx
      version: ${{ inputs.version }}
