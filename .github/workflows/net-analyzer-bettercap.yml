name: net-analyzer/bettercap golang vendor dist

on:
  workflow_dispatch:
    inputs:
      version:
        description: "bettercap version tag (e.g. 2.33.0)"
        required: true

permissions:
  contents: write

jobs:
  golang-dist:
    uses: ./.github/workflows/go-modules.yml
    with:
      project: bettercap
      repository: bettercap/bettercap
      version: ${{ inputs.version }}
