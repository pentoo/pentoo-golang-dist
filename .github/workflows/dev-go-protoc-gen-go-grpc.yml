name: dev-go/protoc-gen-go-grpc golang vendor dist

on:
  workflow_dispatch:
    inputs:
      version:
        description: "protoc-gen-go-grpc version tag (e.g. 1.3.0)"
        required: true

permissions:
  contents: write

jobs:
  golang-dist:
    uses: ./.github/workflows/go-modules.yml
    with:
      project: protoc-gen-go-grpc
      repository: grpc/grpc-go
      version: ${{ inputs.version }}
      ref_prefix: cmd/protoc-gen-go-grpc/v
      go_version_file: cmd/protoc-gen-go-grpc/go.mod
      go_version: stable
      working_directory: cmd/protoc-gen-go-grpc
