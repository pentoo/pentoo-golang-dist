            project: opensnitch
            repository: evilsocket/opensnitch
            version: "1.8.0"
            ref_prefix: v
            go_version_file: daemon/go.mod
            go_version: ""
            module_path: ""
            working_directory: daemon
          - category: app-exploits
            project: traitor
