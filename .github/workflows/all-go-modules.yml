name: all golang vendor dists

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: all-go-modules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  golang-dist:
    name: ${{ matrix.category }}/${{ matrix.project }} ${{ matrix.version }}
